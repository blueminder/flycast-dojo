name: macOS arm64 build

on:
  workflow_dispatch:

jobs:
  build:
    name: arm64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 120

    env:
      VULKAN_VER: 1.3.224.1

    steps:
      - name: Set up build environment
        run: |
          brew update
          brew install libao ldid ninja pulseaudio zlib asio gnutls lua
          command -v aria2c >/dev/null || brew install aria2
          aria2c --parameterized-uri=true "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.dmg" "https://distfiles.macports.org/MoltenVK/vulkansdk-macos-${VULKAN_VER}.dmg" || curl -L -o "vulkansdk-macos-${VULKAN_VER}.dmg" "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.dmg"
          hdiutil attach ./vulkansdk-macos-*.dmg
          sudo /Volumes/vulkansdk-macos-*/InstallVulkan.app/Contents/MacOS/InstallVulkan --root "$HOME/VulkanSDK" --accept-licenses --default-answer --confirm-command install
          hdiutil detach /Volumes/vulkansdk-macos-*
          echo "VULKAN_SDK=$HOME/VulkanSDK/macOS" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Compile a universal OpenMP
        run: HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew reinstall --build-from-source --formula ./shell/apple/libomp.rb

      - name: CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=artifact \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DWITH_SYSTEM_ZLIB=ON -DCURL_ZLIB=OFF -DCPR_BUILD_TESTS=OFF -DCPR_BUILD_TESTS_SSL=OFF -DCMAKE_USE_LIBSSH2=OFF \
            -DAPPLE_BREAKPAD=OFF -G Xcode
          cmake --build build --config RelWithDebInfo --target install

      - name: Package app
        run: |
          cd artifact/bin
          zip -rm macos-arm64-flycast-dojo-6.53.zip "Flycast Dojo.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-flycast-dojo-6.53
          path: artifact/bin
