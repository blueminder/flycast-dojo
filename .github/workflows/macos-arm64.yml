name: macOS arm64 build

on:
  workflow_dispatch:

jobs:
  build:
    name: arm64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 120

    env:
      MOLTENVK_TAG: v1.2.9

    steps:
      - name: Set up build environment
        run: |
          brew update
          brew install libao ldid ninja pulseaudio zlib asio gnutls lua
          # Vulkan SDK dmg is no longer hosted by Lunarg; fetch MoltenVK from GitHub releases instead
          moltenvk_root="$RUNNER_TEMP/MoltenVK-$MOLTENVK_TAG"
          mkdir -p "$moltenvk_root" "$HOME/VulkanSDK/lib"
          aria2c "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_TAG/MoltenVK-macos.tar" -d "$RUNNER_TEMP" -o "MoltenVK-macos-$MOLTENVK_TAG.tar"
          tar -xf "$RUNNER_TEMP/MoltenVK-macos-$MOLTENVK_TAG.tar" -C "$moltenvk_root"
          moltenvk_dylib="$(find "$moltenvk_root" -type f -path '*/macOS/*' -name libMoltenVK.dylib | head -n 1)"
          if [ -z "$moltenvk_dylib" ]; then
            echo "MoltenVK $MOLTENVK_TAG was downloaded, but macOS libMoltenVK.dylib was not found." >&2
            exit 1
          fi
          cp "$moltenvk_dylib" "$HOME/VulkanSDK/lib/libMoltenVK.dylib"
          echo "VULKAN_SDK=$HOME/VulkanSDK" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Compile a universal OpenMP
        run: HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew reinstall --build-from-source --formula ./shell/apple/libomp.rb

      - name: CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=artifact \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DWITH_SYSTEM_ZLIB=ON -DCURL_ZLIB=OFF -DCPR_BUILD_TESTS=OFF -DCPR_BUILD_TESTS_SSL=OFF -DCMAKE_USE_LIBSSH2=OFF \
            -DAPPLE_BREAKPAD=OFF -G Xcode
          cmake --build build --config RelWithDebInfo --target install

      - name: Package app
        run: |
          cd artifact/bin
          zip -rm macos-arm64-flycast-dojo-6.53.zip "Flycast Dojo.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-flycast-dojo-6.53
          path: artifact/bin
